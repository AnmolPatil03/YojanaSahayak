[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yojana-sahayak"
version = "0.1.0"
description = "Citation-first RAG assistant for discovering Indian government welfare schemes and checking eligibility."
license = "MIT"
authors = [{ name = "Anmol Patil" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "httpx>=0.27,<1",
    # openai 3.x moved to httpx2, which respx cannot intercept.
    "openai>=2.30,<3",
    "tiktoken>=0.8",
    "sentence-transformers>=3.3",
    "lancedb>=0.17",
    "pyarrow>=17",
    "numpy>=2.1",
    "rank-bm25>=0.2.2",
    "pymupdf>=1.25",
    "beautifulsoup4>=4.12",
    "mcp>=2.0,<3",
]

[project.optional-dependencies]
onnx = ["sentence-transformers[onnx]>=3.3"]
render = ["playwright>=1.48"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "ruff>=0.8",
]

[project.scripts]
yojana-ingest = "yojana.ingest.pipeline:main"
yojana-review = "yojana.ingest.review_cli:main"
yojana-eval = "yojana.eval.run:main"
yojana-mcp = "yojana.mcp_server:main"

[tool.setuptools.packages.find]
include = ["yojana*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["slow: needs model downloads or network; skipped in CI"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "C4", "PTH", "RET"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "PTH"]

[tool.ruff.format]
quote-style = "double"
